<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>गलती की सजा - मौत!</title>
  <link rel="icon" href="image.png" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Ruslan+Display&display=swap');

    *{margin:0;padding:0;box-sizing:border-box;}

    body{
      height:100vh;width:100%;
      background:url("Image.png") no-repeat center center/cover;
      font-family:'Poppins',sans-serif;
      display:flex;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      position:relative;
      overflow:hidden;
      animation:flicker 8s infinite;
      color:red;
    }

    @keyframes flicker{
      0%,18%,22%,25%,53%,57%,100%{opacity:1}
      20%,24%,55%{opacity:0.3}
    }

    .smoke{
      position:absolute;inset:0;
      background:radial-gradient(circle,rgba(0,0,0,0.3),rgba(0,0,0,0.9));
      mix-blend-mode:overlay;
      animation:moveSmoke 12s ease-in-out infinite alternate;
      z-index:1;
    }

    @keyframes moveSmoke{
      0%{transform:translateY(0);opacity:0.6}
      50%{transform:translateY(-10px);opacity:0.4}
      100%{transform:translateY(10px);opacity:0.6}
    }

    .flash{
      position:fixed;inset:0;
      background:rgba(255,0,0,0.8);
      opacity:0;
      z-index:20;
      pointer-events:none;
      transition:opacity 0.3s ease-out;
    }

    .form-box{
      position:relative;
      z-index:5;
      width:85%;
      max-width:900px;
      background:rgba(0,0,0,0.7);
      border:2px solid red;
      box-shadow:0 0 30px red;
      padding:2rem;
      border-radius:8px;
      text-align:center;
      animation:fadeIn 1.2s ease-out;
    }

    @keyframes fadeIn{
      from{opacity:0;transform:translateY(30px)}
      to{opacity:1;transform:translateY(0)}
    }

    h1{
      font-family:'Ruslan Display',cursive;
      font-size:3rem;
      color:red;
      text-shadow:0 0 30px red,0 0 60px crimson;
      margin-bottom:0.5rem;
      animation:titlePulse 3s infinite alternate;
    }

    @keyframes titlePulse{
      from{text-shadow:0 0 20px red,0 0 40px red;}
      to{text-shadow:0 0 60px red,0 0 120px crimson;}
    }

    h2{
      color:#ff9999;
      font-size:1.2rem;
      margin-bottom:0.3rem;
      text-shadow:0 0 10px #b30000;
    }

    hr{border:none;border-top:1px solid #ff3333;margin:1rem 0;}
    p{color:#ff7777;font-size:1rem;margin-bottom:1.2rem;}

    textarea{
      width:100%;height:220px;resize:vertical;
      border:2px solid red;border-radius:5px;padding:1rem;
      font-size:1rem;outline:none;background:#fff;color:#111;
      box-shadow:0 0 15px rgba(255,0,0,0.3);
      transition:0.3s;
    }

    textarea:focus{
      border-color:#ff3333;box-shadow:0 0 25px red;
    }

    .btn{
      margin-top:1.2rem;background:red;color:black;
      border:none;font-weight:bold;font-size:1.1rem;
      padding:0.8rem 2rem;border-radius:6px;
      box-shadow:0 0 25px red;cursor:pointer;transition:0.3s;
    }

    .btn:hover{
      background:black;color:red;box-shadow:0 0 45px crimson;
    }

    /* Fullscreen Video Overlay */
    .video-overlay{
      position:fixed;
      inset:0;
      background:black;
      display:none;
      align-items:center;
      justify-content:center;
      z-index:50;
    }

    .video-overlay video{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    @media(max-width:768px){
      h1{font-size:2.2rem;}
      h2{font-size:1rem;}
      textarea{height:180px;}
    }
  </style>
</head>
<body>
  <div class="smoke"></div>
  <div class="flash" id="flash"></div>

  <div class="form-box" id="formBox">
    <h1>गलती की सजा - मौत!</h1>
    <h2>गरुड़ पुराण के हिसाब से सबको सजा मिलेगी।</h2>
    <hr>
    <p>अपनी समस्या लिखो। अपरिचित इन्साफ करेगा।</p>
    <form id="complainForm" action="#" method="post">
      <textarea placeholder="यहाँ अपनी समस्या लिखें..."></textarea>
      <br>
      <button type="submit" class="btn" id="submitBtn">SUBMIT</button>
    </form>
  </div>

  <!-- Thunder -->
  <audio id="thunder" src="Audio/aparichit_bgm_extract_extra_high.mp3" preload="auto"></audio>

  <!-- Fullscreen Video -->
  <div class="video-overlay" id="videoOverlay">
    <video id="finalVideo" src="Screen Recording 2025-11-09 194924.mp4"></video>
  </div>

  <script>
    const flash = document.getElementById("flash");
    const thunder = document.getElementById("thunder");
    const btn = document.getElementById("submitBtn");
    const formBox = document.getElementById("formBox");
    const overlay = document.getElementById("videoOverlay");
    const finalVideo = document.getElementById("finalVideo");

    btn.addEventListener("click", (e) => {
      e.preventDefault();

      // flash
      flash.style.opacity = "1";
      setTimeout(() => flash.style.opacity = "0", 250);

      // thunder sound
      thunder.currentTime = 0;
      thunder.volume = 1.0;
      thunder.play().catch(() => {
        document.body.addEventListener("click", () => thunder.play(), { once: true });
      });

      // button pulse
      btn.style.boxShadow = "0 0 50px red, 0 0 100px crimson";
      setTimeout(() => btn.style.boxShadow = "0 0 25px red", 700);

      // vibration
      formBox.animate([
        { transform: "translateX(0)" },
        { transform: "translateX(-5px)" },
        { transform: "translateX(5px)" },
        { transform: "translateX(0)" }
      ], { duration: 400, iterations: 1 });

      // popup then play video after 2–3 sec
      setTimeout(()=>{
        alert("अपरिचित ने तुम्हारी विनती सुन ली है...");
        setTimeout(()=>{
          overlay.style.display = "flex";
          finalVideo.volume = 1.0;
          finalVideo.play();
        }, 2500);
      },700);
    });
  </script>
</body>
</html>
