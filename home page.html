<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>अपरिचित</title>
  <link rel="icon" href="image.png" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Ruslan+Display&display=swap');

    *{margin:0;padding:0;box-sizing:border-box;}

    body{
      height:100vh;width:100%;
      background:url("image.png") no-repeat center center/cover;
      font-family:'Poppins',sans-serif;
      color:red;
      overflow-x:hidden;
      position:relative;
      animation:flicker 8s infinite;
      display:flex;
      flex-direction:column;
      justify-content:flex-start;
      align-items:center;
      text-align:center;
    }

    /* ⚡ Flicker lightning */
    @keyframes flicker{0%,18%,22%,25%,53%,57%,100%{opacity:1}20%,24%,55%{opacity:0.3}}

    /* 🔥 Smoke overlay */
    .smoke{
      position:fixed;inset:0;
      background:radial-gradient(circle,rgba(0,0,0,0.25),rgba(0,0,0,0.8));
      mix-blend-mode:overlay;
      z-index:1;
      animation:smokeMove 10s infinite ease-in-out alternate;
    }
    @keyframes smokeMove{0%{transform:translateY(0);opacity:0.6}50%{transform:translateY(-10px);opacity:0.4}100%{transform:translateY(10px);opacity:0.6}}

    /* 💥 Red flash */
    .flash{
      position:fixed;inset:0;
      background:rgba(255,0,0,0.8);
      opacity:0;
      z-index:20;
      pointer-events:none;
      transition:opacity 0.3s ease-out;
    }

    /* 👁️ Title */
    h1{
      font-family:'Ruslan Display',cursive;
      font-size:6rem;
      color:red;
      text-shadow:0 0 50px #ff0000,0 0 100px #ff0000;
      letter-spacing:4px;
      margin-top:2rem;
      z-index:5;
      animation:titleGlow 3s ease-in-out infinite alternate;
    }
    @keyframes titleGlow{
      from{text-shadow:0 0 20px #ff2020,0 0 60px #ff0000;}
      to{text-shadow:0 0 60px #ff0000,0 0 150px #ff0000;}
    }

    /* container */
    .main-container{
      z-index:5;
      display:flex;
      justify-content:center;
      align-items:center;
      gap:3rem;
      flex-wrap:wrap;
      width:90%;
      max-width:1600px;
      margin-top:2rem;
    }

    /* Left box */
    .left{
      background:rgba(0,0,0,0.7);
      border:2px solid red;
      box-shadow:0 0 25px red;
      border-radius:10px;
      padding:1.5rem;
      flex:1;
      min-width:300px;
      max-width:450px;
      height:360px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
    }
    .left p{
      font-size:1.2rem;
      line-height:1.8;
      color:#ff6666;
      text-shadow:0 0 10px #b30000;
      font-weight:600;
    }

    /* Right video box (extra wide) */
    .right{
      flex:2;
      min-width:700px;
      max-width:1000px;
      height:760px;
      display:flex;
      justify-content:center;
      align-items:center;
    }
    .video-box{
      width:100%;
      height:100%;
      border:10px solid rgba(0,0,0,0.8);
      box-shadow:0 0 90px rgba(255,0,0,0.7);
      overflow:hidden;
      border-radius:12px;
      background:black;
    }
    video{width:100%;height:100%;object-fit:cover;}

    /* button */
    .btn{
      margin-top:2rem;
      background:red;
      color:black;
      font-size:1.4rem;
      font-weight:bold;
      padding:0.8rem 2.2rem;
      border:none;
      border-radius:8px;
      box-shadow:0 0 25px red;
      cursor:pointer;
      transition:0.3s;
      z-index:5;
    }
    .btn:hover{background:black;color:red;box-shadow:0 0 50px crimson;}

    /* responsive */
    @media(max-width:1024px){
      h1{font-size:4rem;}
      .right{max-width:800px;height:520px;}
    }
    @media(max-width:768px){
      h1{font-size:3rem;margin-top:1rem;}
      .main-container{flex-direction:column;gap:2rem;}
      .left,.right{width:90%;height:auto;}
      .right{height:300px;min-width:auto;}
      .video-box{border-width:6px;}
      .left p{font-size:1rem;}
      .btn{margin-top:1.5rem;font-size:1.1rem;}
    }
  </style>
</head>
<body>
  <div class="smoke"></div>
  <div class="flash" id="flash"></div>

  <h1>अपरिचित</h1>

  <div class="main-container">
    <div class="left" id="leftText">
      <p>
        कलयुग अपने अंतिम चरण पर पहुँच चुका है। <br><br>
        पाप का घड़ा भर चुका है। <br><br>
        सबको अपने पापों का प्रायश्चित करवाने अपरिचित आ रहा है।
      </p>
    </div>

    <div class="right">
      <div class="video-box">
        <video id="mainVideo" src="Screen Recording 2025-11-09 190346.mp4" autoplay playsinline loop></video>
      </div>
    </div>
  </div>

  <button class="btn" id="complainBtn">COMPLAIN</button>
  <audio id="thunder" src="Audio/aparichit_bgm_extract_extra_high.mp3" preload="auto"></audio>

  <script>
    const video=document.getElementById("mainVideo");
    const flash=document.getElementById("flash");
    const thunder=document.getElementById("thunder");
    const btn=document.getElementById("complainBtn");
    const leftText=document.getElementById("leftText");

    // autoplay video
    window.addEventListener("load",()=>{
      video.muted=false;
      video.volume=1.0;
      const playPromise=video.play();
      if(playPromise){playPromise.catch(()=>{
        document.body.addEventListener("click",()=>{
          video.muted=false;video.volume=1.0;video.play();
        },{once:true});
      });}
    });

    // complain button click
    btn.addEventListener("click",()=>{
      // red flash
      flash.style.opacity="1";
      setTimeout(()=>flash.style.opacity="0",250);

      // thunder
      thunder.currentTime=0;
      thunder.volume=1.0;
      thunder.play().catch(()=>{
        document.body.addEventListener("click",()=>thunder.play(),{once:true});
      });

      // glow & shake
      btn.style.boxShadow="0 0 60px red,0 0 120px crimson";
      setTimeout(()=>btn.style.boxShadow="0 0 25px red",700);
      leftText.animate([
        {transform:"translateX(0)"},
        {transform:"translateX(-6px)"},
        {transform:"translateX(6px)"},
        {transform:"translateX(0)"}
      ],{duration:400,iterations:1});

      // 🔗 redirect link (change '/request' to your actual page)
      setTimeout(() => {
  window.location.href = "compain.html";
}, 600);

    });
  </script>
</body>
</html>
